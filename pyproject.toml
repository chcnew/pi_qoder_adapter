[project]
name = "pi-qoder-adpter"
version = "0.1.0"
description = "Loopback OpenAI-compatible adapter that bridges Pi to Qoder Agent SDK"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "qoder-agent-sdk>=1.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
pi-qoder-adapter = "pi_qoder_adapter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_qoder_adapter"]
